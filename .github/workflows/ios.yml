name: Build iOS

on:
  push:
    branches: ["master"]
    paths:
      - "shared/**"
      - "iosApp/**"
  pull_request:
    branches: ["master"]
    paths:
      - "shared/**"
      - "iosApp/**"

jobs:
  build:
    runs-on: macos-15

    defaults:
      run:
        working-directory: iosApp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Xcode info
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: Set Default Scheme
        run: |
          set -euo pipefail

          file_to_build="$(find . -maxdepth 1 -name '*.xcodeproj' -print | head -n 1 | sed 's|^\./||')"

          if [ -z "${file_to_build:-}" ]; then
            echo "No .xcodeproj found in iosApp"
            exit 1
          fi

          scheme="$(xcodebuild -list -project "$file_to_build" \
            | sed -n '/Schemes:/,$p' \
            | sed '1d' \
            | sed '/^$/q' \
            | head -n 1 \
            | awk '{$1=$1;print}')"

          if [ -z "${scheme:-}" ]; then
            echo "Could not detect scheme from $file_to_build"
            exit 1
          fi

          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          echo "FILE_TO_BUILD=$file_to_build" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -eo pipefail

          xcodebuild clean build \
            -project "$FILE_TO_BUILD" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ResultBundle \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Print first errors
        if: failure()
        run: |
          echo "=== ERRORS ==="
          grep -n "error:" xcodebuild.log || true
          echo "=== SWIFT / MODULE LINES ==="
          grep -nE "SwiftEmitModule|EmitSwiftModule|CompileSwift" xcodebuild.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            iosApp/xcodebuild.log
            iosApp/build/ResultBundle
