name: Build iOS

on:
  push:
    branches: [ "master" ]
    paths:
      - "shared/**"
      - "iosApp/**"
  pull_request:
    branches: [ "master" ]
    paths:
      - "shared/**"
      - "iosApp/**"

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: iosApp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show files (debug)
        run: ls -la

      - name: Set Default Scheme
        run: |
          set -euo pipefail

          file_to_build="$(find . -maxdepth 1 -name '*.xcodeproj' -print | head -n 1 | sed 's|^\./||')"

          if [ -z "${file_to_build:-}" ]; then
            echo "No .xcodeproj found in iosApp"
            exit 1
          fi

          scheme="$(xcodebuild -list -project "$file_to_build" \
            | sed -n '/Schemes:/,$p' \
            | sed '1d' \
            | sed '/^$/q' \
            | head -n 1 \
            | awk '{$1=$1;print}')"

          if [ -z "${scheme:-}" ]; then
            echo "Could not detect scheme from $file_to_build"
            exit 1
          fi

          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          echo "FILETYPE=project" >> "$GITHUB_ENV"
          echo "FILE_TO_BUILD=$file_to_build" >> "$GITHUB_ENV"

      - name: Build
        env:
          platform: iOS Simulator
        run: |
          set -euo pipefail

          device="$(xcrun xctrace list devices 2>&1 \
            | grep -oE 'iPhone.*?[^\(]+' \
            | head -n 1 \
            | awk '{$1=$1;print}' \
            | sed -e "s/ Simulator$//")"

          if [ -z "${device:-}" ]; then
            echo "Could not detect iPhone simulator device"
            exit 1
          fi

          echo "Building scheme '$SCHEME' project '$FILE_TO_BUILD' on device '$device'"

          xcodebuild clean build \
            -project "$FILE_TO_BUILD" \
            -scheme "$SCHEME" \
            -destination "platform=$platform,name=$device" \
            -derivedDataPath build/DerivedData
