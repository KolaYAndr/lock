name: Build iOS

on:
  push:
    branches: [ "master" ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'shared/**'
      - 'iosApp/**'

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iosApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files (debug)
        run: ls -la

      - name: Set Default Scheme
        run: |
          if ls -A | grep -iq '\.xcworkspace$'; then
            filetype="workspace"
            file_to_build="$(ls -A | grep -i '\.xcworkspace$' | head -1)"
            scheme=$(xcodebuild -list -workspace "$file_to_build" \
              | sed -n '/Schemes:/,$p' | sed '1d' | sed '/^$/q' \
              | head -1 | awk '{$1=$1;print}')
          else
            filetype="project"
            file_to_build="$(ls -A | grep -i '\.xcodeproj$' | head -1)"
            scheme=$(xcodebuild -list -project "$file_to_build" \
              | sed -n '/Schemes:/,$p' | sed '1d' | sed '/^$/q' \
              | head -1 | awk '{$1=$1;print}')
          fi

          echo "SCHEME=$scheme" >> $GITHUB_ENV
          echo "FILETYPE=$filetype" >> $GITHUB_ENV
          echo "FILE_TO_BUILD=$file_to_build" >> $GITHUB_ENV

      - name: Build
        env:
          platform: iOS Simulator
        run: |
          device=$(xcrun xctrace list devices 2>&1 \
            | grep -oE 'iPhone.*?[^\(]+' | head -1 \
            | awk '{$1=$1;print}' | sed -e "s/ Simulator$//")

          echo "Building scheme '$SCHEME' $FILETYPE '$FILE_TO_BUILD' on device '$device'"

          # Если вы хотите быть абсолютно уверены, укажите полный путь к файлу
          xcodebuild build \
            -scheme "$SCHEME" \
            -"$FILETYPE" "$FILE_TO_BUILD" \
            -destination "platform=$platform,name=$device"
