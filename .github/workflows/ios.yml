name: Build iOS

on:
  push:
    branches: [ "master" ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'shared/**'
      - 'iosApp/**'

jobs:
  build:
    name: Build default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change to iOS project folder
        working-directory: iosApp
        run: pwd

      - name: Set Default Scheme
        working-directory: iosApp
        run: |
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then
            filetype="workspace"
            file_to_build="`ls -A | grep -i \\.xcworkspace\$`"
            scheme=$(xcodebuild -list -workspace "$file_to_build" | grep -E '^\s+[^[:space:]].*$' | head -1 | awk '{$1=$1;print}')
          else
            filetype="project"
            file_to_build="`ls -A | grep -i \\.xcodeproj\$`"
            scheme=$(xcodebuild -list -project "$file_to_build" | grep -E '^\s+[^[:space:]].*$' | head -1 | awk '{$1=$1;print}')
          fi

          echo "$scheme" > default
          echo "Using default scheme: $scheme"
          echo "FILETYPE=$filetype" >> $GITHUB_ENV
          echo "FILE_TO_BUILD=$file_to_build" >> $GITHUB_ENV

      - name: Build
        working-directory: iosApp
        env:
          scheme: default
          platform: iOS Simulator
        run: |
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`

          if [ "$scheme" = default ]; then scheme=$(cat default); fi

          filetype_parameter="$FILETYPE"
          file_to_build="$FILE_TO_BUILD"
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`

          echo "Building scheme '$scheme' $filetype_parameter '$file_to_build' on device '$device'"

          xcodebuild build-for-testing \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -destination "platform=$platform,name=$device"
