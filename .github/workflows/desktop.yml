name: Build Desktop

on:
  push:
    branches: [ "master" ]
    paths:
      - 'shared/**'
      - 'sharedUI/**'
      - 'desktopApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'shared/**'
      - 'sharedUI/**'
      - 'desktopApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build-macos:
    name: Build Desktop macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS DMG
        run: ./gradlew :desktopApp:packageDmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: desktop-macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg

  build-windows:
    name: Build Desktop Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Windows MSI
        run: ./gradlew :desktopApp:packageMsi

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  build-linux:
    name: Build Desktop Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux DEB
        run: ./gradlew :desktopApp:packageDeb

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v6
        with:
          name: desktop-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
