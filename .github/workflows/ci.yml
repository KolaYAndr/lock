name: CI Build

on:
  push:
    branches: ["master"]
    paths:
      - "core/**"
      - "feature/**"
      - "shared/**"
      - "sharedUI/**"
      - "androidApp/**"
      - "desktopApp/**"
      - "iosApp/**"
      - "iosComposeApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "core/**"
      - "feature/**"
      - "shared/**"
      - "sharedUI/**"
      - "androidApp/**"
      - "desktopApp/**"
      - "iosApp/**"
      - "iosComposeApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  compile-shared:
    name: Compile shared (core + feature + shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile shared (Metadata, JVM, Android)
        run: ./gradlew :shared:compileKotlinMetadata :shared:compileKotlinJvm :shared:compileAndroidMain

  compile-shared-ui:
    name: Compile sharedUI
    needs: [compile-shared]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile sharedUI (JVM, Android)
        run: ./gradlew :sharedUI:compileKotlinJvm :sharedUI:compileAndroidMain

  build-android:
    name: Build Android (Debug & Release R8)
    needs: [compile-shared-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug & Release APKs
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Lockbox-debug.apk
          path: androidApp/build/outputs/apk/debug/Lockbox-debug.apk

  build-desktop-macos:
    name: Build Desktop macOS (DMG)
    needs: [compile-shared-ui]
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS DMG
        run: ./gradlew :desktopApp:packageDmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: desktop-macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg

  build-desktop-windows:
    name: Build Desktop Windows (MSI)
    needs: [compile-shared-ui]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Windows MSI
        run: ./gradlew :desktopApp:packageMsi

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  build-desktop-linux:
    name: Build Desktop Linux (DEB)
    needs: [compile-shared-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux DEB
        run: ./gradlew :desktopApp:packageDeb

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v6
        with:
          name: desktop-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb

  build-ios-compose:
    name: Build iOS Compose (iosComposeApp)
    needs: [compile-shared-ui]
    runs-on: macos-15
    defaults:
      run:
        working-directory: iosComposeApp
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Detect Xcode scheme
        run: |
          set -euo pipefail
          file_to_build="$(find . -maxdepth 1 -name '*.xcodeproj' -print | head -n 1 | sed 's|^\./||')"
          scheme="$(xcodebuild -list -project "$file_to_build" | sed -n '/Schemes:/,$p' | sed '1d' | sed '/^$/q' | head -n 1 | awk '{$1=$1;print}')"
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          echo "FILE_TO_BUILD=$file_to_build" >> "$GITHUB_ENV"

      - name: Build iosComposeApp
        run: |
          set -eo pipefail
          xcodebuild clean build \
            -project "$FILE_TO_BUILD" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ResultBundle.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            | tee xcodebuild.log

      - name: Print errors
        if: failure()
        run: grep -n "error:" xcodebuild.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-logs-iosComposeApp
          path: |
            iosComposeApp/xcodebuild.log
            iosComposeApp/build/ResultBundle.xcresult

  build-ios-native:
    name: Build iOS Native (iosApp — non-blocking)
    needs: [compile-shared]
    continue-on-error: true
    runs-on: macos-15
    defaults:
      run:
        working-directory: iosApp
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Detect Xcode scheme
        run: |
          set -euo pipefail
          file_to_build="$(find . -maxdepth 1 -name '*.xcodeproj' -print | head -n 1 | sed 's|^\./||')"
          scheme="$(xcodebuild -list -project "$file_to_build" | sed -n '/Schemes:/,$p' | sed '1d' | sed '/^$/q' | head -n 1 | awk '{$1=$1;print}')"
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          echo "FILE_TO_BUILD=$file_to_build" >> "$GITHUB_ENV"

      - name: Build iosApp
        run: |
          set -eo pipefail
          xcodebuild clean build \
            -project "$FILE_TO_BUILD" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ResultBundle.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            | tee xcodebuild.log

      - name: Print errors
        if: failure()
        run: grep -n "error:" xcodebuild.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-logs-iosApp
          path: |
            iosApp/xcodebuild.log
            iosApp/build/ResultBundle.xcresult
